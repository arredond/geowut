repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local hooks use the versions pinned in package.json (run `npm ci` first).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
      - id: oxlint
        name: oxlint
        entry: npx oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: tsc
        entry: npx tsc --noEmit -p tsconfig.json
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
